name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types et tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pomo_test
          POSTGRES_PASSWORD: pomo_test
          POSTGRES_DB: pomo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3333
      HOST: 0.0.0.0
      LOG_LEVEL: info
      APP_KEY: cle_de_test_github_actions_32_caracteres
      SESSION_DRIVER: memory
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: pomo_test
      DB_PASSWORD: pomo_test
      DB_DATABASE: pomo_test

    defaults:
      run:
        working-directory: pomo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pomo/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Appliquer les migrations
        run: node ace migration:run --force

      - name: Tests d'intégration (Japa)
        run: npm run test

      - name: Tests unitaires (Vitest)
        run: npm run test:unit

  e2e:
    name: Tests end-to-end (Cypress)
    needs: quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pomo_test
          POSTGRES_PASSWORD: pomo_test
          POSTGRES_DB: pomo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      PORT: 3333
      HOST: 127.0.0.1
      LOG_LEVEL: info
      APP_KEY: cle_de_test_github_actions_32_caracteres
      SESSION_DRIVER: cookie
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: pomo_test
      DB_PASSWORD: pomo_test
      DB_DATABASE: pomo_test

    defaults:
      run:
        working-directory: pomo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pomo/package-lock.json

      - name: Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: pomo
          # `build` n'est pas exécuté dans un shell : un `&&` y serait passé comme simple
          # argument et tout finirait dans une seule invocation `node ace`. On passe donc
          # par le script npm, dont le `&&` est interprété par npm.
          build: npm run migrate
          start: node ace serve
          wait-on: 'http://127.0.0.1:3333/login'
          wait-on-timeout: 120
          browser: chrome

  build-image:
    name: Construire et publier l'image
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Calculer le nom de l'image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire (et publier si on est sur main)
        uses: docker/build-push-action@v6
        with:
          context: ./pomo
          target: production
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          # cache du npm ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déployer sur le VPS
    if: github.ref == 'refs/heads/main'
    needs: build-image
    runs-on: ubuntu-latest

    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Envoyer le fichier compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/pomo
          # évite de recréer l'arborescence du dépôt dans /opt/pomo
          strip_components: 0

      - name: Déployer
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/pomo

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # APP_IMAGE défini dans le shell l'emporte sur celui du fichier .env
            export APP_IMAGE="${{ needs.build-image.outputs.image }}:${{ github.sha }}"
            echo "Déploiement de $APP_IMAGE"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Attente du passage de l'app à l'état healthy..."
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' pomo_app 2>/dev/null || echo "absent")
              if [ "$status" = "healthy" ]; then
                echo "Application saine. Déploiement réussi."
                docker image prune -f
                exit 0
              fi
              echo "  [$i/30] état : $status"
              sleep 5
            done

            echo "ÉCHEC : l'application n'est pas devenue healthy en 150s."
            docker compose -f docker-compose.prod.yml logs app --tail 60
            exit 1
