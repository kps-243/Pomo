name: pomo-prod

services:
  traefik:
    image: traefik:v3.6
    container_name: pomo_traefik
    restart: unless-stopped
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedByDefault=false'
      - '--providers.docker.network=pomo_edge'
      - '--entryPoints.web.address=:80'
      - '--entryPoints.websecure.address=:443'
      - '--entryPoints.web.http.redirections.entryPoint.to=websecure'
      - '--entryPoints.web.http.redirections.entryPoint.scheme=https'
      - '--certificatesResolvers.letsencrypt.acme.email=${ACME_EMAIL}'
      - '--certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      - '--certificatesResolvers.letsencrypt.acme.tlsChallenge=true'
      - '--ping=true'
      - '--log.level=INFO'
      - '--accesslog=true'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    image: ${APP_IMAGE:-ghcr.io/williammcorreia/pomo:latest}
    container_name: pomo_migrate
    command: ['node', 'ace', 'migration:run', '--force']
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: 'no'

  app:
    image: ${APP_IMAGE:-ghcr.io/williammcorreia/pomo:latest}
    container_name: pomo_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=pomo_edge'
      - 'traefik.http.routers.pomo.rule=Host(`${DOMAIN}`) && !PathPrefix(`/health`)'
      - 'traefik.http.routers.pomo.entryPoints=websecure'
      - 'traefik.http.routers.pomo.tls.certResolver=letsencrypt'
      - 'traefik.http.services.pomo.loadbalancer.server.port=3333'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:15-alpine
    container_name: pomo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  umami:
    image: ghcr.io/umami-software/umami:3.2.0
    container_name: pomo_umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER}:${UMAMI_DB_PASSWORD}@postgres:5432/${UMAMI_DB_DATABASE}
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=pomo_edge'
      - 'traefik.http.routers.umami.rule=Host(`${UMAMI_DOMAIN}`)'
      - 'traefik.http.routers.umami.entryPoints=websecure'
      - 'traefik.http.routers.umami.tls.certResolver=letsencrypt'
      - 'traefik.http.services.umami.loadbalancer.server.port=3000'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  edge:
    name: pomo_edge

  internal:
    name: pomo_internal
    internal: true

volumes:
  postgres_data:
  traefik_certs:
