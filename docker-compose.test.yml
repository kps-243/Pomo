services:
  app:
    build:
      context: ./pomo
      target: test
    container_name: pomo_app
    ports:
      - "3333:3333"
      - "24678:24678"
    volumes:
      - ./pomo:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    env_file:
      - ./pomo/.env.docker

  postgres:
    image: postgres:15
    container_name: pomo_postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./pomo/.env.docker

  redis:
    image: redis:alpine
    container_name: pomo_redis
    ports:
      - "6379:6379"

  adminer:
    image: adminer:latest
    container_name: pomo_adminer
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres


volumes:
  postgres_data:
