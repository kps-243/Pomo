services:
  postgres:
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pomo_admin -d pomodb']
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3333/login || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

  tests:
    image: cypress/included:15.18.1
    network_mode: 'service:app'
    depends_on:
      app:
        condition: service_healthy
    working_dir: /e2e
    env_file:
      - ./pomo/.env.docker
    environment:
      CYPRESS_baseUrl: http://127.0.0.1:3333
    volumes:
      - ./pomo:/e2e
    entrypoint: ['bash', '-c']
    command:
      - 'npm run test:unit && npx cypress run && npm run test:integration'
